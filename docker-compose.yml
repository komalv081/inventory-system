version: '3.9'

services:
  app:
    image: php:8.2-fpm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: inventory
      DB_USERNAME: inventory
      DB_PASSWORD: inventory
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    command: php-fpm

  nginx:
    image: nginx:alpine
    ports:
      - '8000:80'
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  queue:
    image: php:8.2-fpm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    command: php artisan queue:work redis --tries=3 --timeout=90
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: inventory
      DB_USERNAME: inventory
      DB_PASSWORD: inventory
      REDIS_HOST: redis
      REDIS_PORT: 6379

volumes:
  postgres_data:
